<div class="page__game">
    <app-modal [title]="'Settings'" [show]="showModal" (close)="toggleModal()"><sound-settings/></app-modal>
    <app-modal [title]="'LOG'" [show]="showLogModal" (close)="openModalLog()">
        <game-log [data]="log"></game-log>
    </app-modal>
    <app-modal [title]="'Load Data'" [show]="showLoadDataModal" (close)="toggleLoadDataModal()"><load-data [gameId]="id" (gameLoadedChange)="loadGame($event)" /></app-modal>
    <app-modal [title]="'Save Data'" [show]="showSaveDataModal" (close)="toggleSaveDataModal()"><save-data [saveDataValue]="getSaveData()"/></app-modal>

    <div class="game__container">
        @if (gameLoaded) {
            <div class="game__screen" #background (click)="nextEvent()" >
                @if (!isFullScreen){
                <div class="game__controls">
                    <button (click)="fullScreen($event)" >
                        <svg xmlns="http://www.w3.org/2000/svg" height="24px" width="24px" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 3.75v4.5m0-4.5h4.5m-4.5 0L9 9M3.75 20.25v-4.5m0 4.5h4.5m-4.5 0L9 15M20.25 3.75h-4.5m4.5 0v4.5m0-4.5L15 9m5.25 11.25h-4.5m4.5 0v-4.5m0 4.5L15 15" />
                        </svg>                  
                    </button>
                    <button (click)="toggleModal($event)">
                        <svg xmlns="http://www.w3.org/2000/svg" height="24px" width="24px" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M9.594 3.94c.09-.542.56-.94 1.11-.94h2.593c.55 0 1.02.398 1.11.94l.213 1.281c.063.374.313.686.645.87.074.04.147.083.22.127.325.196.72.257 1.075.124l1.217-.456a1.125 1.125 0 0 1 1.37.49l1.296 2.247a1.125 1.125 0 0 1-.26 1.431l-1.003.827c-.293.241-.438.613-.43.992a7.723 7.723 0 0 1 0 .255c-.008.378.137.75.43.991l1.004.827c.424.35.534.955.26 1.43l-1.298 2.247a1.125 1.125 0 0 1-1.369.491l-1.217-.456c-.355-.133-.75-.072-1.076.124a6.47 6.47 0 0 1-.22.128c-.331.183-.581.495-.644.869l-.213 1.281c-.09.543-.56.94-1.11.94h-2.594c-.55 0-1.019-.398-1.11-.94l-.213-1.281c-.062-.374-.312-.686-.644-.87a6.52 6.52 0 0 1-.22-.127c-.325-.196-.72-.257-1.076-.124l-1.217.456a1.125 1.125 0 0 1-1.369-.49l-1.297-2.247a1.125 1.125 0 0 1 .26-1.431l1.004-.827c.292-.24.437-.613.43-.991a6.932 6.932 0 0 1 0-.255c.007-.38-.138-.751-.43-.992l-1.004-.827a1.125 1.125 0 0 1-.26-1.43l1.297-2.247a1.125 1.125 0 0 1 1.37-.491l1.216.456c.356.133.751.072 1.076-.124.072-.044.146-.086.22-.128.332-.183.582-.495.644-.869l.214-1.28Z" />
                            <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
                          </svg>     
                    </button>
                    <button (click)="toggleSaveDataModal($event)">
                        <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="currentColor"><path d="M840-680v480q0 33-23.5 56.5T760-120H200q-33 0-56.5-23.5T120-200v-560q0-33 23.5-56.5T200-840h480l160 160Zm-80 34L646-760H200v560h560v-446ZM480-240q50 0 85-35t35-85q0-50-35-85t-85-35q-50 0-85 35t-35 85q0 50 35 85t85 35ZM240-560h360v-160H240v160Zm-40-86v446-560 114Z"/></svg>
                    </button>
                    <button (click)="nextScene($event)">
                        <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="currentColor"><path d="M660-240v-480h80v480h-80Zm-440 0v-480l360 240-360 240Zm80-240Zm0 90 136-90-136-90v180Z"/></svg>
                    </button>
                </div>
                }
                @if (!isFullScreen){
                <div class="game__text">
                    <div class="text__controls">
                        <span id="character" #character>Name Character</span>
                        <div class="controls">
                            <button (click)="openModalLog($event)">
                                <svg xmlns="http://www.w3.org/2000/svg" height="12px" width="12px" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M9 15 3 9m0 0 6-6M3 9h12a6 6 0 0 1 0 12h-3" />
                                </svg>                          
                                LOG
                            </button>
                            <button [ngClass]="btn_auto" (click)="autoScene($event)">
                                <svg xmlns="http://www.w3.org/2000/svg" height="14px" width="14px" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0 3.181 3.183a8.25 8.25 0 0 0 13.803-3.7M4.031 9.865a8.25 8.25 0 0 1 13.803-3.7l3.181 3.182m0-4.991v4.99" />
                                </svg>                          
                                AUTO
                            </button>
                            <button [ngClass]="btn_ffw" (click)="fastScene($event)">
                                <svg xmlns="http://www.w3.org/2000/svg" height="14px" width="14px" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M3 8.689c0-.864.933-1.406 1.683-.977l7.108 4.061a1.125 1.125 0 0 1 0 1.954l-7.108 4.061A1.125 1.125 0 0 1 3 16.811V8.69ZM12.75 8.689c0-.864.933-1.406 1.683-.977l7.108 4.061a1.125 1.125 0 0 1 0 1.954l-7.108 4.061a1.125 1.125 0 0 1-1.683-.977V8.69Z" />
                                </svg>
                                FFW</button>
                        </div>
                    </div>
                    <span id="text" #text></span>
                </div>
                }
            </div>
        }@else{
            <div class="title__screen" #bgTitle>
                <button class="btn__screen" (click)="startGame()">Start</button>
                <button class="btn__screen" (click)="toggleLoadDataModal($event)">Load</button>
            </div>
        }
    </div>
</div>
